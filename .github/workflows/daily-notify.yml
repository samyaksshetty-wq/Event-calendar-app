name: Send daily event notifications

on:
  # NOTE: GitHub Actions' schedule trigger is best-effort and can be delayed by
  # hours on low-traffic repos (confirmed: this drifted from ~10am to ~6pm UAE
  # over a week). The real daily 9am UAE trigger now comes from an external
  # cron-ping service (e.g. cron-job.org) hitting /api/push/send-today
  # directly. This workflow is kept only for manual runs via workflow_dispatch.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger today's notifications
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.BACKEND_URL }}/api/push/send-today" -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}")
          echo "Response: $response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "Request failed with HTTP status $status"
            exit 1
          fi
